<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Iniciar Sesión · Sa·zón Ecosistema Nutresa</title>

  <script>
    if (localStorage.getItem('sazon_theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sazon: {
              marfil: '#F4F4E8',
              cacao: '#643B22',
              cacaoText: '#F4F4E8',
              verdeNoche: '#114622',
              verdeHondo: '#215B33',
              verdeHoja: '#3D8E33',
              hoja: '#7FBA00',
              verdeNutresa: '#1B4332',
              verdeNutresaCard: '#133326',
              verdeNeon: '#66d149'
            }
          },
          fontFamily: {
            poppins: ['"Poppins"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="../assets/css/fonts.css" rel="stylesheet"/>

  <style>
    h1, h2, h3, h4, h5, h6, .font-title { font-family: 'Poppins', sans-serif; }
    body, p, span, figcaption { font-family: 'Inter', sans-serif; }
    button, input, select, label, .font-mono-tag, code, .badge, time, output { font-family: 'IBM Plex Mono', monospace; }
    body, header, footer, aside, section, article, button, input {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
  </style>
</head>

<body class="bg-sazon-marfil text-slate-800 dark:bg-sazon-verdeNoche dark:text-slate-100 min-h-screen flex flex-col justify-between font-inter select-none" id="app-body">

  <header class="w-full px-4 sm:px-8 py-5">
    <section class="max-w-5xl mx-auto flex items-center justify-between">
      <a class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white dark:bg-sazon-verdeNutresaCard hover:bg-slate-50 dark:hover:bg-sazon-verdeNutresa border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 font-mono-tag text-xs font-semibold shadow-sm transition-all" href="../../index.html">
        <i class="bi bi-arrow-left text-sm text-sazon-verdeHoja dark:text-sazon-verdeNeon"></i>
        <span>Volver al Inicio</span>
      </a>

      <figure class="flex items-center gap-2.5 m-0">
        <span class="w-8 h-8 rounded-lg bg-sazon-verdeHoja text-white flex items-center justify-center font-bold text-base shadow-sm">
          <svg class="w-4 h-4 fill-current text-white" viewbox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
          </svg>
        </span>
        <figcaption class="leading-none">
          <span class="font-poppins font-black text-lg text-slate-900 dark:text-white block">Sa·zón</span>
          <span class="font-mono-tag text-[9px] uppercase tracking-wider text-slate-500 dark:text-slate-400 block">Ecosistema Nutresa</span>
        </figcaption>
      </figure>
    </section>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-6 sm:py-10">
    <article class="w-full max-w-md bg-white dark:bg-sazon-verdeNutresaCard rounded-3xl shadow-xl shadow-stone-200/50 dark:shadow-2xl border border-slate-200/80 dark:border-white/10 p-6 sm:p-9 space-y-6">
      
      <header class="text-center space-y-2">
        <figure class="mx-auto w-12 h-12 rounded-2xl bg-sazon-verdeHoja/10 dark:bg-white/10 text-sazon-verdeHoja dark:text-sazon-verdeNeon flex items-center justify-center text-xl shadow-inner m-0 mb-3">
          <i class="bi bi-shield-lock-fill"></i>
        </figure>
        <h1 class="font-poppins font-bold text-2xl sm:text-3xl text-slate-900 dark:text-white tracking-tight leading-tight m-0">
          Iniciar Sesión
        </h1>
        <p class="font-inter text-xs sm:text-sm text-slate-500 dark:text-slate-400 m-0 leading-relaxed font-normal">
          Accede a tu recetario digital y administra tu despensa con productos Grupo Nutresa.
        </p>
      </header>

      <form class="space-y-4" id="login-form">
        
        <label class="block space-y-1.5 font-mono-tag text-xs font-semibold text-slate-700 dark:text-slate-300">
          <span>Correo Electrónico o Usuario</span>
          <section class="relative flex items-center">
            <i class="bi bi-envelope absolute left-3.5 text-slate-400 text-sm"></i>
            <input autocomplete="email" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0c2419] border border-slate-300 dark:border-white/20 text-sm font-inter text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sazon-verdeHoja dark:focus:ring-sazon-verdeNeon focus:border-sazon-verdeHoja dark:focus:border-sazon-verdeNeon transition-all shadow-sm" id="login-email" name="email" placeholder="ejemplo@nutresa.com" required="" type="text"/>
          </section>
        </label>

        <label class="block space-y-1.5 font-mono-tag text-xs font-semibold text-slate-700 dark:text-slate-300">
          <section class="flex items-center justify-between">
            <span>Contraseña</span>
            <a class="text-[11px] text-sazon-verdeHoja dark:text-sazon-verdeNeon hover:underline font-normal font-mono-tag" href="#">
              ¿Olvidaste tu contraseña?
            </a>
          </section>
          <section class="relative flex items-center">
            <i class="bi bi-lock absolute left-3.5 text-slate-400 text-sm"></i>
            <input autocomplete="current-password" class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0c2419] border border-slate-300 dark:border-white/20 text-sm font-inter text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sazon-verdeHoja dark:focus:ring-sazon-verdeNeon focus:border-sazon-verdeHoja dark:focus:border-sazon-verdeNeon transition-all shadow-sm" id="login-password" name="password" placeholder="••••••••" required="" type="password"/>
            <button aria-label="Mostrar u ocultar contraseña" class="absolute right-3.5 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors" id="btn-toggle-password" type="button">
              <i class="bi bi-eye text-sm" id="icon-eye"></i>
            </button>
          </section>
        </label>

        <section class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer font-mono-tag text-xs text-slate-600 dark:text-slate-400 font-normal">
            <input class="w-4 h-4 rounded border-slate-300 text-sazon-verdeHoja focus:ring-sazon-verdeHoja cursor-pointer" id="remember-me" type="checkbox"/>
            <span>Recordar mi sesión</span>
          </label>
        </section>

        <button class="w-full py-3.5 px-4 rounded-xl bg-sazon-verdeHoja hover:bg-[#327a29] active:scale-[0.99] text-white font-poppins font-bold text-sm shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 group mt-2" id="btn-submit-login" type="submit">
          <span>Ingresar al Sistema</span>
          <i class="bi bi-box-arrow-in-right text-base group-hover:translate-x-1 transition-transform"></i>
        </button>

        <section class="pt-4 border-t border-slate-200 dark:border-white/10 text-center space-y-2.5 font-mono-tag text-xs">
          <p class="text-slate-500 dark:text-slate-400 m-0">
            ¿Aún no tienes una cuenta registrada?
          </p>
          <a class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-white dark:bg-white/5 hover:bg-slate-50 dark:hover:bg-white/10 border border-slate-300 dark:border-white/20 text-slate-700 dark:text-slate-200 font-bold transition-all shadow-sm group" href="./registro.html">
            <i class="bi bi-person-plus text-sazon-verdeHoja dark:text-sazon-verdeNeon group-hover:scale-110 transition-transform"></i>
            <span>Crear cuenta nueva</span>
          </a>
        </section>

      </form>

      <footer class="pt-2 border-t border-slate-100 dark:border-white/5 flex items-center justify-center gap-2">
        <span class="h-6 px-2 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center" title="Zenú">
          <img alt="Zenú" class="h-3 w-auto object-contain" src="../assets/images/zenu.png"/>
        </span>
        <span class="h-6 px-2 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center" title="Doria">
          <img alt="Doria" class="h-3 w-auto object-contain" src="../assets/images/doriapng.png"/>
        </span>
        <span class="h-6 px-2 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center" title="Jet">
          <img alt="Jet" class="h-3 w-auto object-contain" src="../assets/images/jet.svg"/>
        </span>
        <span class="h-6 px-2 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center" title="Pietrán">
          <img alt="Pietrán" class="h-3 w-auto object-contain" src="../assets/images/pietran.png"/>
        </span>
        <span class="h-6 px-2 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center" title="Noel">
          <img alt="Noel" class="h-3.5 w-auto object-contain" src="../assets/images/noel.svg"/>
        </span>
      </footer>

    </article>
  </main>

  <footer class="w-full py-4 text-center">
    <p class="font-mono-tag text-[11px] text-slate-500 dark:text-slate-400 m-0">
      Sa·zón · Grupo Nutresa © 2026 · Proyecto Integrador
    </p>
  </footer>

  <aside class="fixed bottom-5 right-5 z-40 bg-white/95 dark:bg-[#133124]/95 backdrop-blur-md rounded-full p-1.5 shadow-2xl border border-black/10 dark:border-white/20 flex items-center gap-1 font-mono text-xs">
    <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#3D8E33] text-white font-bold shadow-sm transition-all duration-200" id="themeDayBtn" onclick="switchTheme('light')" title="Activar Modo Día" type="button">
      <i class="bi bi-sun-fill text-sm"></i>
      <span>Día</span>
    </button>
    <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-all duration-200" id="themeNightBtn" onclick="switchTheme('dark')" title="Activar Modo Noche" type="button">
      <i class="bi bi-moon-stars-fill text-sm"></i>
      <span>Noche</span>
    </button>
  </aside>

  <script>
    function switchTheme(theme) {
      const html = document.documentElement;
      const dayBtn = document.getElementById('themeDayBtn');
      const nightBtn = document.getElementById('themeNightBtn');

      if (theme === 'dark') {
        html.classList.add('dark');
        html.classList.remove('light');
        try { localStorage.setItem('sazon_theme', 'dark'); } catch(e) {}
        if (dayBtn && nightBtn) {
          nightBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#3D8E33] text-white font-bold shadow-sm transition-all duration-200';
          dayBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-all duration-200';
        }
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        try { localStorage.setItem('sazon_theme', 'light'); } catch(e) {}
        if (dayBtn && nightBtn) {
          dayBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#3D8E33] text-white font-bold shadow-sm transition-all duration-200';
          nightBtn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-all duration-200';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('sazon_theme');
        switchTheme(saved === 'dark' ? 'dark' : 'light');
      } catch(e) {
        switchTheme('light');
      }

      const btnToggle = document.getElementById('btn-toggle-password');
      const inputPass = document.getElementById('login-password');
      const iconEye = document.getElementById('icon-eye');

      if (btnToggle && inputPass && iconEye) {
        btnToggle.addEventListener('click', () => {
          const isPass = inputPass.type === 'password';
          inputPass.type = isPass ? 'text' : 'password';
          iconEye.className = isPass ? 'bi bi-eye-slash text-sm' : 'bi bi-eye text-sm';
        });
      }
    });
  </script>
</body>
</html>
